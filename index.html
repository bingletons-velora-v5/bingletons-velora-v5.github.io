<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>velora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0e0e14;
      --bg2: #16161f;
      --bg3: #1e1e2a;
      --bg4: #252535;
      --surface: #1c1c28;
      --accent: #a78bfa;
      --accent2: #7c3aed;
      --accent-soft: rgba(167,139,250,0.12);
      --accent-glow: rgba(167,139,250,0.25);
      --text: #f0eeff;
      --text2: #9b97b8;
      --text3: #5e5a7a;
      --border: rgba(167,139,250,0.1);
      --border2: rgba(167,139,250,0.2);
      --red: #f87171;
      --red-soft: rgba(248,113,113,0.12);
      --radius: 12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14,14,20,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 64px;
    }

    .logo {
      font-family: 'Dancing Script', cursive;
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #c4b5fd, #e9d5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.5px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .search-wrap {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      pointer-events: none;
    }
    .search {
      width: 100%;
      height: 40px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0 16px 0 42px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search:focus { border-color: var(--accent); background: var(--bg2); }
    .search::placeholder { color: var(--text3); }

    .header-right {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }

    .movies-link {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .movies-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      position: relative;
    }
    .icon-btn:hover,
    .icon-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .cats-bar {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .cats-bar::-webkit-scrollbar { height: 0; }
    .cat-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s;
    }
    .cat-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .cat-btn.active {
      border-color: var(--accent);
      color: var(--bg);
      background: var(--accent);
      font-weight: 500;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 113px);
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: sticky;
      top: 113px;
      max-height: calc(100vh - 113px);
      overflow-y: auto;
    }
    .sidebar-section {
      padding: 8px 16px 4px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      font-weight: 500;
    }
    .sidebar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      margin: 0 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text2);
      font-size: 13px;
      transition: all 0.18s;
      border: none;
      background: none;
      font-family: 'DM Sans', sans-serif;
      text-align: left;
      width: calc(100% - 16px);
    }
    .sidebar-btn svg { flex-shrink: 0; opacity: 0.7; }
    .sidebar-btn:hover { background: var(--bg3); color: var(--text); }
    .sidebar-btn.active { background: var(--accent-soft); color: var(--accent); }
    .sidebar-btn.active svg { opacity: 1; }
    .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 8px 16px; }

    .content {
      flex: 1;
      padding: 24px;
      min-width: 0;
    }
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .game-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      background: var(--bg3);
      border: 1px solid var(--border);
      aspect-ratio: 1;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .game-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 32px rgba(124,58,237,0.25);
    }
    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .game-card .fav-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(14,14,20,0.75);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
      color: var(--text2);
    }
    .game-card:hover .fav-btn { opacity: 1; }
    .game-card .fav-btn.saved { opacity: 1; color: var(--red); background: var(--red-soft); }
    .game-card .fav-btn svg { width: 14px; height: 14px; }

    .game-card .card-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 22px 8px 8px;
      background: linear-gradient(to top, rgba(10,10,18,0.92) 0%, transparent 100%);
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .game-card:hover .card-label { opacity: 1; }

    .pagination {
      display: flex;
      gap: 6px;
      margin-top: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .page-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .page-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(10,10,18,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-start;
      justify-content: flex-end;
    }
    .settings-overlay.open { display: flex; }
    .settings-panel {
      width: 320px;
      height: 100vh;
      background: var(--bg2);
      border-left: 1px solid var(--border2);
      padding: 24px;
      overflow-y: auto;
      animation: slideIn 0.25s ease;
      position: relative;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .settings-panel h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-panel h2 svg { color: var(--accent); }
    .setting-group { margin-bottom: 20px; }
    .setting-label {
      font-size: 12px;
      color: var(--text3);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .setting-row span { font-size: 13px; color: var(--text2); }

    .toggle {
      width: 40px;
      height: 22px;
      border-radius: 11px;
      background: var(--bg4);
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .toggle::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text3);
      top: 2px;
      left: 2px;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle.on { background: var(--accent2); border-color: var(--accent); }
    .toggle.on::after { transform: translateX(18px); background: #fff; }

    .swatch-row { display: flex; gap: 8px; }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.15s;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: #fff; }

    .select-input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .select-input:focus { border-color: var(--accent); }

    .settings-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .settings-close:hover { border-color: var(--accent); color: var(--accent); }

    .player-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(10,10,18,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .player-overlay.open { display: flex; }

    .player-shell {
      width: min(1100px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .player-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bg2);
      border-radius: var(--radius) var(--radius) 0 0;
      border: 1px solid var(--border2);
      border-bottom: none;
    }

    .player-title {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
      flex-shrink: 0;
    }
    .player-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .player-btn.fav-active {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-soft);
    }
    .player-btn.close-btn:hover {
      border-color: #f87171;
      color: #f87171;
    }

    .player-frame-wrap {
      width: 100%;
      min-height: 66vh;
      background: #000;
      border: 1px solid var(--border2);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      overflow: hidden;
      position: relative;
    }

    .player-frame-wrap iframe {
      width: 100%;
      height: 66vh;
      border: none;
      display: block;
      background: #000;
    }

    .player-loading {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(2px);
      pointer-events: none;
    }
    .player-loading.show { display: flex; }

    .player-overlay.fullscreen-mode {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
    }
    .player-overlay.fullscreen-mode .player-shell {
      width: 100%;
      height: 100%;
      max-width: none;
    }
    .player-overlay.fullscreen-mode .player-bar {
      border-radius: 0;
    }
    .player-overlay.fullscreen-mode .player-frame-wrap {
      border-radius: 0;
      min-height: calc(100vh - 56px);
    }
    .player-overlay.fullscreen-mode .player-frame-wrap iframe {
      height: calc(100vh - 56px);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 12px;
      color: var(--text3);
    }
    .empty-state svg { opacity: 0.4; }
    .empty-state p { font-size: 14px; }

    .theme-violet { --accent: #a78bfa; --accent2: #7c3aed; --accent-soft: rgba(167,139,250,0.12); --accent-glow: rgba(167,139,250,0.25); }
    .theme-cyan { --accent: #22d3ee; --accent2: #0891b2; --accent-soft: rgba(34,211,238,0.12); --accent-glow: rgba(34,211,238,0.25); }
    .theme-rose { --accent: #fb7185; --accent2: #e11d48; --accent-soft: rgba(251,113,133,0.12); --accent-glow: rgba(251,113,133,0.25); }
    .theme-amber { --accent: #fbbf24; --accent2: #d97706; --accent-soft: rgba(251,191,36,0.12); --accent-glow: rgba(251,191,36,0.25); }
    .theme-emerald { --accent: #34d399; --accent2: #059669; --accent-soft: rgba(52,211,153,0.12); --accent-glow: rgba(52,211,153,0.25); }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .game-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      .header { padding: 0 12px; }
      .movies-link { padding: 0 12px; }
    }

    .no-results {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
      color: var(--text3);
      gap: 10px;
    }
    .no-results.show { display: flex; }
    .no-results svg { opacity: 0.3; }
    .no-results p { font-size: 14px; }

    .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--bg4);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-center { display: flex; align-items: center; justify-content: center; height: 200px; }
  </style>
</head>
<body class="theme-violet">

<header class="header">
  <a href="#" class="logo" id="logoBtn" onclick="setView('all'); return false;">velora</a>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.35-4.35"/>
    </svg>
    <input class="search" id="searchInput" type="text" placeholder="search games...">
  </div>

  <div class="header-right">
    <a class="movies-link" href="/m.html">movies</a>

    <button class="icon-btn" id="favsBtn" title="favorites" onclick="setView('favs')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>
    <button class="icon-btn active" id="settingsBtn" title="settings" onclick="openSettings()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</header>

<div class="cats-bar" id="catsBar"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">discover</div>
    <button class="sidebar-btn active" id="sb-all" onclick="setView('all')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      all games
    </button>
    <button class="sidebar-btn" id="sb-recent" onclick="setView('recent')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
      </svg>
      recently played
    </button>
    <button class="sidebar-btn" id="sb-favs" onclick="setView('favs')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      favorites
    </button>
    <hr class="sidebar-divider">
    <div class="sidebar-section">categories</div>
    <div id="sidebarCats"></div>
  </aside>

  <main class="content" id="mainContent">
    <div class="section-title" id="sectionTitle">all games</div>

    <div class="game-grid" id="grid">
      <div class="loading-center" style="grid-column:1/-1">
        <div class="spinner"></div>
      </div>
    </div>

    <div class="no-results" id="noResults">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6M11 8v6" stroke-dasharray="2 2"/>
      </svg>
      <p>no games found for "<span id="noResultsQuery"></span>"</p>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>
</div>

  <div class="player-shell" id="playerShell">

    <h2>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <div class="swatch" style="background:#fbbf24" data-theme="theme-amber" onclick="setTheme(this)"></div>

      <select class="select-input" id="bgSelect" onchange="setBg(this.value)">
        <option value="#0e0e14">dark nebula (default)</option>
        <option value="#0a0a0a">pitch black</option>
        <option value="#0d0f1a">midnight blue</option>

<script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
<script>
  const grid = document.getElementById('grid');
  const pagination = document.getElementById('pagination');
  const searchInput = document.getElementById('searchInput');
  const catsBar = document.getElementById('catsBar');
  const sidebarCats = document.getElementById('sidebarCats');
  const sectionTitle = document.getElementById('sectionTitle');
  const noResults = document.getElementById('noResults');
  const playerLoading = document.getElementById('playerLoading');
  const gameFrame = document.getElementById('gameFrame');
  const playerOverlay = document.getElementById('playerOverlay');
  const playerShell = document.getElementById('playerShell');

  const PAGE_SIZE = 24;
  let currentPage = 1;
  let currentQuery = '';
  let currentCategory = '';
  let currentView = 'all';
  let currentGameId = null;
  let currentGameName = '';
  let favorites = JSON.parse(localStorage.getItem('velora_favs') || '[]');
  let recentlyPlayed = JSON.parse(localStorage.getItem('velora_recent') || '[]');
  let showTitles = true;
  let animsEnabled = true;
  let openToken = 0;
  let luminReady = false;
  let booted = false;

  function safeThemeName(theme) {
    return String(theme || 'theme-violet').replace(/[^a-z-]/g, '');
  }

  async function boot() {
    if (booted) return;
    booted = true;

    try {
      if (window.Lumin && typeof Lumin.init === 'function') {
        await Lumin.init({
          headless: true,
          onReady: () => console.log('velora: lumin ready'),
          onError: (err) => console.error('velora: lumin error', err),
        });
        luminReady = true;
      }
    } catch (err) {
      console.error('velora init failed:', err);
    }

    try {
      if (luminReady && typeof Lumin.getCategories === 'function') {
        const { categories } = await Lumin.getCategories();
        const cats = Array.isArray(categories) ? categories : [];
        renderCatBar(['all', ...cats]);
        renderSidebarCats(cats);
      } else {
        renderCatBar(['all']);
      }
    } catch (err) {
      console.error('category load failed:', err);
      renderCatBar(['all']);
    }

    applySavedSettings();
    await loadPage(1);
  }

  window.addEventListener('DOMContentLoaded', boot);

  let debounce;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      currentQuery = e.target.value.trim();
      currentPage = 1;
      currentView = 'all';
      currentCategory = '';
      updateSidebarActive('sb-all');
      syncCategoryButtons();
      loadPage(1);
    }, 300);
  });

  function syncCategoryButtons() {
    catsBar.querySelectorAll('.cat-btn').forEach((b) => {
      const isAll = b.textContent === 'all';
      b.classList.toggle('active', isAll && !currentCategory);
      if (!isAll && currentCategory) b.classList.toggle('active', b.textContent === currentCategory);
    });
    sidebarCats.querySelectorAll('.sidebar-btn').forEach((b) => b.classList.remove('active'));
  }

  function renderCatBar(cats) {
    catsBar.innerHTML = '';
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (cat === 'all' && !currentCategory ? ' active' : '');
      btn.textContent = cat;
      btn.onclick = () => {
        currentCategory = cat === 'all' ? '' : cat;
        currentPage = 1;
        currentView = 'all';
        updateSidebarActive('sb-all');
        catsBar.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        sectionTitle.textContent = cat;
        loadPage(1);
      };
      catsBar.appendChild(btn);
    });
  }

  function renderSidebarCats(cats) {
    sidebarCats.innerHTML = '';
    cats.slice(0, 12).forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'sidebar-btn';
      btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>${cat}`;
      btn.onclick = () => {
        currentCategory = cat;
        currentPage = 1;
        currentView = 'all';
        updateSidebarActive(null);
        sectionTitle.textContent = cat;
        catsBar.querySelectorAll('.cat-btn').forEach(b => {
          b.classList.toggle('active', b.textContent === cat);
        });
        loadPage(1);
      };
      sidebarCats.appendChild(btn);
    });
  }

  function setView(view) {
    currentView = view;
    currentQuery = '';
    searchInput.value = '';
    currentCategory = '';
    currentPage = 1;
    syncCategoryButtons();
    updateSidebarActive('sb-' + view);

    document.getElementById('favsBtn').classList.toggle('active', view === 'favs');

    if (view === 'favs') {
      sectionTitle.textContent = 'favorites';
      renderFavs();
    } else if (view === 'recent') {
      sectionTitle.textContent = 'recently played';
      renderRecent();
    } else {
      sectionTitle.textContent = 'all games';
      loadPage(1);
    }
  }

  function updateSidebarActive(id) {
    document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
    if (id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    }
  }

  async function loadPage(page) {
    grid.innerHTML = '<div class="loading-center" style="grid-column:1/-1"><div class="spinner"></div></div>';
    pagination.innerHTML = '';
    noResults.classList.remove('show');

    try {
      let result = { games: [], pages: 1 };

      if (luminReady && typeof Lumin.getGames === 'function') {
        result = await Lumin.getGames({
          page,
          limit: PAGE_SIZE,
          q: currentQuery,
          category: currentCategory || undefined,
        });
      }

      currentPage = page;
      grid.innerHTML = '';

      if (!result.games || !result.games.length) {
        noResults.classList.add('show');
        document.getElementById('noResultsQuery').textContent = currentQuery || currentCategory || '';
        return;
      }

      const imgUrls = await Promise.all(result.games.map(async g => {
        if (luminReady && typeof Lumin.getImageUrl === 'function') {
          return await Lumin.getImageUrl(g.image_token);
        }
        return '';
      }));

      result.games.forEach((game, i) => renderCard(game, imgUrls[i]));
      renderPagination(result.pages || 1);
    } catch (err) {
      console.error('loadPage failed:', err);
      grid.innerHTML = '';
      noResults.classList.add('show');
      document.getElementById('noResultsQuery').textContent = '';
    }
  }

  function renderCard(game, imgUrl) {
    const card = document.createElement('div');
    card.className = 'game-card';
    const isFav = favorites.includes(game.id);

    card.innerHTML = `
      <img src="${imgUrl || ''}" alt="${game.name}" loading="lazy">
      <div class="card-label">${game.name}</div>
      <button class="fav-btn ${isFav ? 'saved' : ''}" data-id="${game.id}">
        <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
    `;

    card.querySelector('.fav-btn').addEventListener('click', (e) => {
      toggleFav(e, game.id);
    });

    card.addEventListener('click', (e) => {
      if (e.target.closest('.fav-btn')) return;
      openGame(game.id, game.name);
    });

    grid.appendChild(card);
  }

  function toggleFav(e, id) {
    e.stopPropagation();
    const btn = e.currentTarget;
    const svg = btn.querySelector('svg');
    const idx = favorites.indexOf(id);

    if (idx === -1) {
      favorites.push(id);
      btn.classList.add('saved');
      svg.setAttribute('fill', 'currentColor');
    } else {
      favorites.splice(idx, 1);
      btn.classList.remove('saved');
      svg.setAttribute('fill', 'none');
    }

    localStorage.setItem('velora_favs', JSON.stringify(favorites));
    if (currentGameId === id) updatePlayerFavBtn();
  }

  function togglePlayerFav() {
    if (!currentGameId) return;
    const idx = favorites.indexOf(currentGameId);

    if (idx === -1) favorites.push(currentGameId);
    else favorites.splice(idx, 1);

    localStorage.setItem('velora_favs', JSON.stringify(favorites));
    updatePlayerFavBtn();

    const btn = grid.querySelector(`.fav-btn[data-id="${currentGameId}"]`);
    if (btn) {
      const svg = btn.querySelector('svg');
      if (favorites.includes(currentGameId)) {
        btn.classList.add('saved');
        svg.setAttribute('fill', 'currentColor');
      } else {
        btn.classList.remove('saved');
        svg.setAttribute('fill', 'none');
      }
    }
  }

  function updatePlayerFavBtn() {
    const btn = document.getElementById('playerFavBtn');
    if (!btn) return;
    btn.classList.toggle('fav-active', favorites.includes(currentGameId));
  }

  async function renderFavs() {
    pagination.innerHTML = '';
    noResults.classList.remove('show');

    if (!favorites.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <p>no favorites yet — click the heart on any game</p>
      </div>`;
      return;
    }

    grid.innerHTML = '<div class="loading-center" style="grid-column:1/-1"><div class="spinner"></div></div>';

    try {
      const result = luminReady && typeof Lumin.getGames === 'function'
        ? await Lumin.getGames({ page: 1, limit: 200, q: '' })
        : { games: [] };

      const favGames = (result.games || []).filter(g => favorites.includes(g.id));

      if (!favGames.length) {
        grid.innerHTML = '';
        noResults.classList.add('show');
        document.getElementById('noResultsQuery').textContent = '';
        return;
      }

      grid.innerHTML = '';
      const imgUrls = await Promise.all(favGames.map(async g => {
        if (luminReady && typeof Lumin.getImageUrl === 'function') return await Lumin.getImageUrl(g.image_token);
        return '';
      }));
      favGames.forEach((game, i) => renderCard(game, imgUrls[i]));
    } catch (err) {
      console.error('renderFavs failed:', err);
      grid.innerHTML = '';
    }
  }

  async function renderRecent() {
    pagination.innerHTML = '';
    noResults.classList.remove('show');

    if (!recentlyPlayed.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        <p>no recent games — play something first!</p>
      </div>`;
      return;
    }

    grid.innerHTML = '<div class="loading-center" style="grid-column:1/-1"><div class="spinner"></div></div>';

    try {
      const result = luminReady && typeof Lumin.getGames === 'function'
        ? await Lumin.getGames({ page: 1, limit: 200, q: '' })
        : { games: [] };

      const recentGames = recentlyPlayed
        .map(id => result.games.find(g => g.id === id))
        .filter(Boolean);

      grid.innerHTML = '';
      const imgUrls = await Promise.all(recentGames.map(async g => {
        if (luminReady && typeof Lumin.getImageUrl === 'function') return await Lumin.getImageUrl(g.image_token);
        return '';
      }));
      recentGames.forEach((game, i) => renderCard(game, imgUrls[i]));
    } catch (err) {
      console.error('renderRecent failed:', err);
      grid.innerHTML = '';
    }
  }

  async function resolveGameUrl(id) {
    if (!window.Lumin) throw new Error('Lumin not loaded');

    if (typeof Lumin.getGameUrl === 'function') {
      const res = await Lumin.getGameUrl(id);
      if (typeof res === 'string') return res;
      if (res && typeof res.url === 'string') return res.url;
    }

    if (typeof Lumin.getEmbedUrl === 'function') {
      const res = await Lumin.getEmbedUrl(id);
      if (typeof res === 'string') return res;
      if (res && typeof res.url === 'string') return res.url;
    }

    if (typeof Lumin.getLaunchUrl === 'function') {
      const res = await Lumin.getLaunchUrl(id);
      if (typeof res === 'string') return res;
      if (res && typeof res.url === 'string') return res.url;
    }

    throw new Error('No embeddable game url method found');
  }

  async function openGame(id, name) {
    currentGameId = id;
    currentGameName = name;

    recentlyPlayed = recentlyPlayed.filter(r => r !== id);
    recentlyPlayed.unshift(id);
    if (recentlyPlayed.length > 50) recentlyPlayed.pop();
    localStorage.setItem('velora_recent', JSON.stringify(recentlyPlayed));

    document.getElementById('playerTitle').textContent = name;
    updatePlayerFavBtn();

    playerOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    const myToken = ++openToken;
    playerLoading.classList.add('show');
    gameFrame.src = '';

    try {
      const url = await resolveGameUrl(id);
      if (myToken !== openToken) return;
      gameFrame.src = url;
      gameFrame.onload = () => {
        if (myToken === openToken) playerLoading.classList.remove('show');
      };
    } catch (err) {
      console.error('Failed to load game:', err);
      if (myToken === openToken) {
        playerLoading.classList.remove('show');
        alert('could not load this game right now.');
      }
    }
  }

  function closePlayer() {
    openToken++;
    playerOverlay.classList.remove('open');
    playerOverlay.classList.remove('fullscreen-mode');
    document.body.style.overflow = '';
    gameFrame.src = '';
    playerLoading.classList.remove('show');
    currentGameId = null;

    if (document.fullscreenElement) {
      document.exitFullscreen?.().catch(() => {});
    }
  }

  function closePlayerOutside(e) {
    if (e.target === playerOverlay) closePlayer();
  }

  async function reloadGame() {
    if (!currentGameId) return;

    const myToken = ++openToken;
    playerLoading.classList.add('show');

    try {
      const url = await resolveGameUrl(currentGameId);
      if (myToken !== openToken) return;
      gameFrame.src = url;
      gameFrame.onload = () => {
        if (myToken === openToken) playerLoading.classList.remove('show');
      };
    } catch (err) {
      console.error('Failed to reload game:', err);
      if (myToken === openToken) playerLoading.classList.remove('show');
    }
  }

  async function toggleFullscreen() {
    const shell = playerShell;

    if (!document.fullscreenElement) {
      try {
        if (shell.requestFullscreen) {
          await shell.requestFullscreen();
          return;
        }
      } catch (err) {
        console.warn('Fullscreen API failed, using CSS fullscreen mode.', err);
      }
    } else {
      try {
        await document.exitFullscreen();
        return;
      } catch (err) {
        console.warn('Exit fullscreen failed, using CSS fullscreen mode.', err);
      }
    }

    playerOverlay.classList.toggle('fullscreen-mode');
  }

  document.addEventListener('fullscreenchange', () => {
    const isFs = !!document.fullscreenElement;
    playerOverlay.classList.toggle('fullscreen-mode', isFs);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closePlayer();
      closeSettings();
    }
  });

  function renderPagination(totalPages) {
    pagination.innerHTML = '';
    if (totalPages <= 1) return;

    const prev = document.createElement('button');
    prev.className = 'page-btn';
    prev.textContent = '←';
    prev.disabled = currentPage === 1;
    prev.onclick = () => loadPage(currentPage - 1);
    pagination.appendChild(prev);

    const range = [];
    for (let p = Math.max(1, currentPage - 2); p <= Math.min(totalPages, currentPage + 2); p++) range.push(p);

    if (range[0] > 1) {
      addPageBtn(1);
      if (range[0] > 2) addPageDot();
    }

    range.forEach(p => addPageBtn(p));

    if (range[range.length - 1] < totalPages) {
      if (range[range.length - 1] < totalPages - 1) addPageDot();
      addPageBtn(totalPages);
    }

    const next = document.createElement('button');
    next.className = 'page-btn';
    next.textContent = '→';
    next.disabled = currentPage === totalPages;
    next.onclick = () => loadPage(currentPage + 1);
    pagination.appendChild(next);
  }

  function addPageBtn(p) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
    btn.textContent = p;
    btn.onclick = () => loadPage(p);
    pagination.appendChild(btn);
  }

  function addPageDot() {
    const dot = document.createElement('span');
    dot.textContent = '…';
    dot.style.cssText = 'display:flex;align-items:center;padding:0 4px;color:var(--text3);font-size:13px;';
    pagination.appendChild(dot);
  }

  function openSettings() {
    document.getElementById('settingsOverlay').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('settingsOverlay').classList.remove('open');
  }

  function closeSettingsOutside(e) {
    if (e.target === document.getElementById('settingsOverlay')) closeSettings();
  }

  function setTheme(el) {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');

    const theme = safeThemeName(el.dataset.theme);
    document.body.className = document.body.className.replace(/theme-\w+/g, '').trim();
    document.body.classList.add(theme);
    localStorage.setItem('velora_theme', theme);
  }

  function setGridSize(val) {
    const g = document.getElementById('grid');
    g.style.gridTemplateColumns = `repeat(auto-fill, minmax(${val}px, 1fr))`;
    localStorage.setItem('velora_gridsize', val);
  }

  function toggleTitles() {
    showTitles = !showTitles;
    document.getElementById('titleToggle').classList.toggle('on', showTitles);
    document.querySelectorAll('.card-label').forEach(el => { el.style.display = showTitles ? '' : 'none'; });
    localStorage.setItem('velora_titles', showTitles);
  }

  function toggleAnims() {
    animsEnabled = !animsEnabled;
    document.getElementById('animToggle').classList.toggle('on', animsEnabled);

    const style = document.getElementById('anim-override') || (() => {
      const s = document.createElement('style');
      s.id = 'anim-override';
      document.head.appendChild(s);
      return s;
    })();

    style.textContent = animsEnabled ? '' : '.game-card:hover{transform:none!important;box-shadow:none!important;}';
    localStorage.setItem('velora_anims', animsEnabled);
  }

  function setBg(val) {
    document.documentElement.style.setProperty('--bg', val);
    document.body.style.background = val;
    localStorage.setItem('velora_bg', val);
  }

  function applySavedSettings() {
    const theme = safeThemeName(localStorage.getItem('velora_theme') || 'theme-violet');
    document.body.className = theme;

    const themeSwatch = document.querySelector(`.swatch[data-theme="${theme}"]`);
    if (themeSwatch) {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      themeSwatch.classList.add('active');
    }

    const gs = localStorage.getItem('velora_gridsize');
    if (gs) {
      document.getElementById('gridSizeSelect').value = gs;
      setGridSize(gs);
    }

    const bg = localStorage.getItem('velora_bg');
    if (bg) {
      document.getElementById('bgSelect').value = bg;
      setBg(bg);
    }

    const titles = localStorage.getItem('velora_titles');
    if (titles !== null) {
      showTitles = titles === 'true';
      document.getElementById('titleToggle').classList.toggle('on', showTitles);
      document.querySelectorAll('.card-label').forEach(el => { el.style.display = showTitles ? '' : 'none'; });
    }

    const anims = localStorage.getItem('velora_anims');
    if (anims !== null) {
      animsEnabled = anims === 'true';
      document.getElementById('animToggle').classList.toggle('on', animsEnabled);

      const style = document.getElementById('anim-override') || (() => {
        const s = document.createElement('style');
        s.id = 'anim-override';
        document.head.appendChild(s);
        return s;
      })();

      style.textContent = animsEnabled ? '' : '.game-card:hover{transform:none!important;box-shadow:none!important;}';
    }
  }
</script>
</body>
</html>
