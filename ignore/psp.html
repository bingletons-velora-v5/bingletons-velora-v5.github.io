<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>PSP Mini Portal</title>
  <style type="text/css">
    /* Optimized for 480x272 PSP screen */
    body {
      background-color: #0f111a;
      color: #e0e6ed;
      font-family: sans-serif;
      margin: 0;
      padding: 8px;
      text-align: center;
    }
    
    .card {
      background-color: #1a1d28;
      border: 1px solid #2e344e;
      margin: 6px auto;
      padding: 10px;
      max-width: 440px;
    }

    h1 {
      font-size: 18px;
      margin: 4px 0 8px 0;
      color: #00b4d8;
    }

    .count-display {
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      margin: 8px 0;
    }

    button {
      background-color: #0077b6;
      color: #ffffff;
      border: 1px solid #90e0ef;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      margin: 4px;
    }

    button:active {
      background-color: #90e0ef;
      color: #000000;
    }

    .sub-btn {
      background-color: #33394b;
      border: 1px solid #555e78;
      font-size: 11px;
      padding: 4px 8px;
    }

    ul.menu {
      list-style-type: none;
      padding: 0;
      margin: 8px 0 0 0;
      text-align: left;
    }

    ul.menu li {
      padding: 4px;
      border-bottom: 1px solid #252a3a;
      font-size: 12px;
    }

    a {
      color: #90e0ef;
      text-decoration: none;
    }
  </style>

  <script type="text/javascript">
    // Simple ES3-compatible JavaScript (Safe for PSP NetFront browser)
    var count = 0;

    function addClick() {
      count = count + 1;
      document.getElementById('counter').innerHTML = count;
    }

    function resetClick() {
      count = 0;
      document.getElementById('counter').innerHTML = count;
    }
  </script>
</head>
<body>

  <div class="card">
    <h1>PSP MINI PORTAL</h1>
    <div class="count-display" id="counter">0</div>
    
    <!-- Big pressable button for PSP analog / D-pad clicking -->
    <button onclick="addClick()">CLICK ME!</button>
    <button class="sub-btn" onclick="resetClick()">Reset</button>
  </div>

  <div class="card">
    <div style="font-size: 12px; font-weight: bold; color: #888;">QUICK LINKS</div>
    <ul class="menu">
      <li>&bull; <a href="#">Placeholder Link 1</a></li>
      <li>&bull; <a href="#">Placeholder Link 2</a></li>
      <!-- Add your future links or tools here! -->
    </ul>
  </div>

</body>
</html>
