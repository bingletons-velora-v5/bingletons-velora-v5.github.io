<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>games</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080c;
      --bg2: #0b0d14;
      --panel: rgba(16, 18, 28, 0.92);
      --panel2: rgba(21, 24, 36, 0.96);
      --line: rgba(255,255,255,.08);
      --line2: rgba(255,255,255,.14);
      --text: #f3f5ff;
      --muted: rgba(243,245,255,.68);
      --accent: #7c5cff;
      --accent2: #4dd2ff;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --radius: 22px;
      --radius-sm: 16px;
      --header-h: 70px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(124,92,255,.22), transparent 26%),
        radial-gradient(circle at 80% 10%, rgba(77,210,255,.14), transparent 20%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(10,12,18,.92), rgba(10,12,18,.72));
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: lowercase;
      white-space: nowrap;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--accent2) 35%, var(--accent) 100%);
      box-shadow: 0 0 18px rgba(124,92,255,.75);
    }

    .searchWrap {
      flex: 1;
      display: flex;
      justify-content: center;
      min-width: 0;
    }

    .search {
      width: min(680px, 100%);
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 0 16px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
    }

    .search::placeholder { color: rgba(243,245,255,.45); }
    .search:focus { border-color: rgba(124,92,255,.6); box-shadow: 0 0 0 4px rgba(124,92,255,.12); }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .pill {
      height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .pill:hover { transform: translateY(-1px); background: rgba(255,255,255,.07); border-color: var(--line2); }
    .pill.active { background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(77,210,255,.85)); border-color: transparent; }

    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
      position: relative;
    }

    .content {
      min-height: 0;
      overflow: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.18) transparent;
    }

    .content::-webkit-scrollbar { width: 10px; }
    .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .playerShell {
      display: none;
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(18,20,30,.98), rgba(10,12,18,.98));
      box-shadow: var(--shadow);
    }

    .playerShell.show { display: block; }

    .playerTop {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      flex-wrap: wrap;
    }

    .gameTitle {
      font-size: 15px;
      font-weight: 700;
      margin-right: auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .iconBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 42px;
      height: 40px;
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor: pointer;
    }

    .iconBtn:hover { background: rgba(255,255,255,.08); }
    .iconBtn.activeFav { border-color: rgba(255, 183, 77, .45); background: rgba(255, 183, 77, .12); }

    .playerStage {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .playerFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .gridWrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .sectionTitle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: lowercase;
    }

    .masonry {
      column-count: 6;
      column-gap: 14px;
    }

    @media (max-width: 1400px) { .masonry { column-count: 5; } }
    @media (max-width: 1120px) { .masonry { column-count: 4; } }
    @media (max-width: 840px) { .masonry { column-count: 3; } }
    @media (max-width: 620px) { .masonry { column-count: 2; } .topbar { gap: 8px; } .brand { display: none; } }
    @media (max-width: 430px) { .masonry { column-count: 1; } }

    .card {
      display: inline-block;
      width: 100%;
      margin: 0 0 14px;
      break-inside: avoid;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.025));
      box-shadow: 0 10px 25px rgba(0,0,0,.18);
      cursor: pointer;
      transform: translateZ(0);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(124,92,255,.35);
      box-shadow: 0 18px 32px rgba(0,0,0,.3);
    }

    .card.active {
      border-color: rgba(77,210,255,.45);
      box-shadow: 0 0 0 1px rgba(77,210,255,.15), 0 18px 32px rgba(0,0,0,.3);
    }

    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: rgba(255,255,255,.03);
    }

    .thumb.tall { aspect-ratio: 4 / 5; }
    .thumb.wide { aspect-ratio: 5 / 4; }
    .thumb.huge { aspect-ratio: 1 / 1; }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .2s ease;
    }

    .card:hover .thumb img { transform: scale(1.04); }

    .overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 34px 12px 12px;
      background: linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,.28), transparent);
    }

    .name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.1;
      text-shadow: 0 2px 10px rgba(0,0,0,.5);
      word-break: break-word;
    }

    .meta {
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: rgba(243,245,255,.72);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      white-space: nowrap;
    }

    .favMark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,.36);
      box-shadow: 0 0 0 4px rgba(255,255,255,.05);
      flex: 0 0 auto;
    }

    .card.fav .favMark {
      background: #ffd166;
      box-shadow: 0 0 0 4px rgba(255, 209, 102, .16);
    }

    .corner {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      display: flex;
      gap: 8px;
    }

    .miniTag {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(10,12,18,.66);
      border: 1px solid rgba(255,255,255,.09);
      font-size: 12px;
      backdrop-filter: blur(10px);
    }

    .loading, .empty {
      padding: 40px 16px;
      text-align: center;
      color: rgba(243,245,255,.55);
      font-size: 14px;
    }

    .footerNote {
      margin-top: 6px;
      text-align: center;
      color: rgba(243,245,255,.45);
      font-size: 12px;
      padding-bottom: 10px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><span class="dot"></span><span>games</span></div>
      <div class="searchWrap">
        <input id="search" class="search" type="text" placeholder="search games" autocomplete="off" />
      </div>
      <div class="actions">
        <button id="favOnlyBtn" class="pill" type="button">favorites</button>
      </div>
    </div>

    <div class="main">
      <div class="content" id="content">
        <div class="hero">
          <div id="playerShell" class="playerShell">
            <div class="playerTop">
              <div id="gameTitle" class="gameTitle">pick a game</div>
              <button id="favBtn" class="iconBtn" type="button" title="favorite">☆ favorite</button>
              <button id="reloadBtn" class="iconBtn" type="button" title="reload">↻ reload</button>
              <button id="fullscreenBtn" class="iconBtn" type="button" title="fullscreen">⛶ fullscreen</button>
              <button id="closeBtn" class="iconBtn" type="button" title="close">✕</button>
            </div>
            <div class="playerStage">
              <iframe id="playerFrame" class="playerFrame" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
            </div>
          </div>
        </div>

        <div class="gridWrap">
          <div class="sectionTitle">
            <div>browse</div>
            <div id="countLabel">loading</div>
          </div>
          <div id="grid" class="masonry"></div>
          <div id="status" class="footerNote"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    const PAGE_SIZE = 36;

    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const status = document.getElementById('status');
    const countLabel = document.getElementById('countLabel');
    const playerShell = document.getElementById('playerShell');
    const playerFrame = document.getElementById('playerFrame');
    const gameTitle = document.getElementById('gameTitle');
    const favBtn = document.getElementById('favBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const closeBtn = document.getElementById('closeBtn');
    const favOnlyBtn = document.getElementById('favOnlyBtn');

    let currentPage = 1;
    let currentQuery = '';
    let currentCategory = '';
    let currentGame = null;
    let currentFrameUrl = '';
    let showFavoritesOnly = false;
    let gameCache = [];
    let debounce;
    const favoritesKey = 'lumin_favorites_v1';
    const sizes = ['square', 'tall', 'square', 'wide', 'square', 'huge'];

    const favoriteIds = new Set(JSON.parse(localStorage.getItem(favoritesKey) || '[]'));

    function saveFavorites() {
      localStorage.setItem(favoritesKey, JSON.stringify([...favoriteIds]));
    }

    function setStatus(text) {
      status.textContent = text || '';
    }

    function markActiveCard() {
      document.querySelectorAll('.card').forEach(card => {
        card.classList.toggle('active', card.dataset.id === String(currentGame?.id || ''));
        card.classList.toggle('fav', favoriteIds.has(card.dataset.id));
      });
    }

    function updateFavButton() {
      if (!currentGame) {
        favBtn.textContent = '☆ favorite';
        favBtn.classList.remove('activeFav');
        return;
      }
      const active = favoriteIds.has(String(currentGame.id));
      favBtn.textContent = active ? '★ favorited' : '☆ favorite';
      favBtn.classList.toggle('activeFav', active);
    }

    function setCurrentGame(game, url) {
      currentGame = game;
      currentFrameUrl = url;
      playerShell.classList.add('show');
      gameTitle.textContent = game.name;
      playerFrame.src = url;
      updateFavButton();
      markActiveCard();
      setStatus(`now playing ${game.name.toLowerCase()}`);
    }

    function toggleFavorite(game) {
      const id = String(game.id);
      if (favoriteIds.has(id)) favoriteIds.delete(id);
      else favoriteIds.add(id);
      saveFavorites();
      updateFavButton();
      renderGrid();
      markActiveCard();
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function chooseSize(index) {
      return sizes[index % sizes.length];
    }

    async function init() {
      setStatus('connecting to sdk...');
      await Lumin.init({
        headless: true,
        onReady: () => console.log('Lumin ready'),
        onError: (err) => console.error('Lumin error', err),
      });
      await loadGames();
    }

    async function loadGames() {
      grid.innerHTML = '<div class="loading">loading games...</div>';
      const result = await Lumin.getGames({
        page: currentPage,
        limit: PAGE_SIZE,
        q: currentQuery,
        category: currentCategory || undefined,
      });

      gameCache = result.games || [];
      countLabel.textContent = `${gameCache.length} games`;

      const imageUrls = await Promise.all(gameCache.map(g => Lumin.getImageUrl(g.image_token)));
      const rendered = gameCache.map((game, i) => ({
        game,
        imageUrl: imageUrls[i],
        size: chooseSize(i),
      }));

      renderGrid(rendered);
      setStatus(result.pages > 1 ? `page ${currentPage} of ${result.pages}` : '');
    }

    function renderGrid(prepared = null) {
      const items = prepared || gameCache.map((game, i) => ({
        game,
        imageUrl: null,
        size: chooseSize(i),
      }));

      const filtered = showFavoritesOnly
        ? items.filter(item => favoriteIds.has(String(item.game.id)))
        : items;

      if (!filtered.length) {
        grid.innerHTML = '<div class="empty">no games found</div>';
        countLabel.textContent = '0 games';
        markActiveCard();
        return;
      }

      if (!prepared) {
        grid.innerHTML = filtered.map(({ game, size }, i) => {
          const fallback = '';
          const savedFav = favoriteIds.has(String(game.id)) ? 'fav' : '';
          const active = currentGame && String(currentGame.id) === String(game.id) ? 'active' : '';
          return `
            <article class="card ${savedFav} ${active}" data-id="${escapeHtml(game.id)}" data-name="${escapeHtml(game.name)}">
              <div class="thumb ${size}">
                ${fallback}
                <div class="corner">
                  <span class="miniTag">${size}</span>
                </div>
                <div class="overlay">
                  <div class="name">${escapeHtml(game.name)}</div>
                  <div class="meta">
                    <span class="badge"><span class="favMark"></span><span>tap to play</span></span>
                    <span class="badge">${favoriteIds.has(String(game.id)) ? 'saved' : 'new'}</span>
                  </div>
                </div>
              </div>
            </article>
          `;
        }).join('');

        markActiveCard();
        return;
      }

      grid.innerHTML = filtered.map(({ game, imageUrl, size }) => {
        const savedFav = favoriteIds.has(String(game.id)) ? 'fav' : '';
        const active = currentGame && String(currentGame.id) === String(game.id) ? 'active' : '';
        return `
          <article class="card ${savedFav} ${active}" data-id="${escapeHtml(game.id)}" data-name="${escapeHtml(game.name)}" data-url="${escapeHtml(imageUrl)}">
            <div class="thumb ${size}">
              <img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(game.name)}" loading="lazy" />
              <div class="corner">
                <span class="miniTag">${size}</span>
              </div>
              <div class="overlay">
                <div class="name">${escapeHtml(game.name)}</div>
                <div class="meta">
                  <span class="badge"><span class="favMark"></span><span>tap to play</span></span>
                  <span class="badge">${favoriteIds.has(String(game.id)) ? 'saved' : 'new'}</span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      markActiveCard();
    }

    async function openGame(game) {
      const url = await Lumin.getGameUrl(game.id);
      setCurrentGame(game, url);
      renderGrid();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    grid.addEventListener('click', async (e) => {
      const card = e.target.closest('.card');
      if (!card) return;
      const game = gameCache.find(g => String(g.id) === String(card.dataset.id));
      if (!game) return;
      await openGame(game);
    });

    search.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(async () => {
        currentQuery = search.value.trim();
        currentPage = 1;
        await loadGames();
      }, 220);
    });

    favBtn.addEventListener('click', () => {
      if (!currentGame) return;
      toggleFavorite(currentGame);
    });

    reloadBtn.addEventListener('click', () => {
      if (!currentGame || !currentFrameUrl) return;
      playerFrame.src = currentFrameUrl;
    });

    fullscreenBtn.addEventListener('click', async () => {
      const el = playerShell;
      if (!document.fullscreenElement) {
        await el.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    });

    closeBtn.addEventListener('click', () => {
      currentGame = null;
      currentFrameUrl = '';
      playerFrame.src = 'about:blank';
      playerShell.classList.remove('show');
      updateFavButton();
      markActiveCard();
      setStatus('');
    });

    favOnlyBtn.addEventListener('click', () => {
      showFavoritesOnly = !showFavoritesOnly;
      favOnlyBtn.classList.toggle('active', showFavoritesOnly);
      favOnlyBtn.textContent = showFavoritesOnly ? 'favorites on' : 'favorites';
      renderGrid();
      setStatus(showFavoritesOnly ? 'showing favorites only' : '');
    });

    init().catch(err => {
      console.error(err);
      grid.innerHTML = '<div class="empty">sdk failed to load</div>';
      setStatus('check the sdk connection');
    });
  </script>
</body>
</html>
