<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>velora</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: rgba(18, 18, 18, 0.92);
      --panel-border: rgba(255, 255, 255, 0.08);
      --card: #171717;
      --card-hover: #202020;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --accent: #f0c040;
      --danger: #ff6b81;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 16px;
      --radius-sm: 12px;
      --ui-width: 220px;
      --gap: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(240, 192, 64, 0.08), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.03), transparent 25%),
        var(--bg);
    }

    .app {
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    .ui-box {
      position: fixed;
      top: 14px;
      left: 14px;
      width: min(var(--ui-width), calc(100vw - 28px));
      min-height: 170px;
      z-index: 30;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ui-top {
      padding: 14px 14px 10px;
    }

    .brand {
      margin: 0;
      font-size: 18px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      color: var(--text);
    }

    .ui-sub {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .ui-bottom {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255,255,255,0.02);
    }

    .search {
      width: 100%;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #121212;
      color: var(--text);
      padding: 0 12px;
      outline: none;
      font-size: 14px;
    }

    .search::placeholder {
      color: #7d7d7d;
    }

    .search:focus {
      border-color: rgba(240, 192, 64, 0.6);
    }

    .ui-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      height: 38px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #161616;
      color: var(--text);
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: 0.18s ease;
    }

    .btn:hover {
      background: #1f1f1f;
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-accent {
      background: rgba(240, 192, 64, 0.12);
      border-color: rgba(240, 192, 64, 0.28);
      color: #ffd77a;
    }

    .btn-favorite.active {
      color: #ff90a3;
      border-color: rgba(255, 107, 129, 0.35);
      background: rgba(255, 107, 129, 0.1);
    }

    .grid-wrap {
      width: 100%;
      min-height: 100vh;
      padding: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      grid-auto-rows: 1fr;
      gap: var(--gap);
      width: 100%;
    }

    .card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: var(--card);
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.04);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      min-height: 140px;
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(255,255,255,0.12);
    }

    .card.large {
      grid-column: span 2;
      grid-row: span 2;
    }

    .card.active {
      grid-column: span 3;
      grid-row: span 3;
      z-index: 2;
      border-color: rgba(240, 192, 64, 0.45);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      background: #111;
    }

    .card-media,
    .card-player {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    .card-media img,
    .card-player iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      object-fit: cover;
      background: #0f0f0f;
    }

    .card-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .card-name {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
    }

    .card-tag {
      font-size: 10px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    .player-ui {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      z-index: 3;
      pointer-events: none;
    }

    .player-meta,
    .player-controls {
      pointer-events: auto;
    }

    .player-meta {
      max-width: calc(100% - 180px);
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(10, 10, 10, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }

    .player-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      margin: 0;
    }

    .player-subtitle {
      margin: 4px 0 0;
      font-size: 11px;
      color: rgba(255,255,255,0.62);
    }

    .player-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .icon-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(10, 10, 10, 0.74);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      transition: 0.18s ease;
    }

    .icon-btn:hover {
      background: rgba(25, 25, 25, 0.95);
      border-color: rgba(255,255,255,0.18);
    }

    .icon-btn.favorite.active {
      color: #ff95a7;
      border-color: rgba(255, 107, 129, 0.35);
    }

    .status,
    .empty {
      grid-column: 1 / -1;
      min-height: 180px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    .pagination {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(18, 18, 18, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .page-info {
      padding: 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .card.active {
        grid-column: span 2;
        grid-row: span 2;
      }
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      }

      .card.large {
        grid-column: span 1;
        grid-row: span 1;
      }

      .card.active {
        grid-column: span 2;
        grid-row: span 2;
      }

      .player-meta {
        max-width: calc(100% - 120px);
      }

      .player-title {
        font-size: 13px;
      }

      .player-subtitle {
        font-size: 10px;
      }

      .icon-btn {
        min-width: 34px;
        height: 34px;
        padding: 0 10px;
        font-size: 12px;
      }

      .ui-box {
        width: min(210px, calc(100vw - 28px));
      }

      .pagination {
        left: 14px;
        right: 14px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="ui-box">
      <div class="ui-top">
        <h1 class="brand">velora</h1>
        <div class="ui-sub">game wall</div>
      </div>

      <div class="ui-bottom">
        <input id="searchInput" class="search" type="text" placeholder="search games...">
        <div class="ui-actions">
          <button id="searchBtn" class="btn btn-accent">search</button>
          <button id="settingsBtn" class="btn">settings</button>
        </div>
      </div>
    </aside>

    <main class="grid-wrap">
      <section id="grid" class="grid"></section>
    </main>

    <div id="pagination" class="pagination">
      <button id="prevBtn" class="btn">prev</button>
      <div id="pageInfo" class="page-info">page 1</div>
      <button id="nextBtn" class="btn">next</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    const PAGE_SIZE = 24;
    const FAVORITES_KEY = 'veloraFavorites_v1';

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const pagination = document.getElementById('pagination');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');

    const state = {
      currentPage: 1,
      totalPages: 1,
      query: '',
      games: [],
      imageMap: new Map(),
      activeGameId: null,
      activeGameUrl: '',
      loading: false
    };

    function getFavorites() {
      try {
        const raw = localStorage.getItem(FAVORITES_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    }

    function isFavorite(id) {
      return getFavorites().includes(id);
    }

    function toggleFavorite(id) {
      const favorites = getFavorites();
      const exists = favorites.includes(id);
      const next = exists ? favorites.filter(x => x !== id) : [...favorites, id];
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(next));
      renderGrid();
    }

    function debounce(fn, delay = 300) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function randomizeSize(index, game) {
      const base = (game.id || index || 0).toString();
      let sum = 0;
      for (let i = 0; i < base.length; i++) sum += base.charCodeAt(i);
      return sum % 7 === 0;
    }

    function setHashForGame(game) {
      const slug = (game.name || 'game')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '');
      history.replaceState(null, '', '#' + slug + '-' + game.id);
    }

    function clearHash() {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    function showLoading(message = 'loading games...') {
      grid.innerHTML = '<div class="status">' + escapeHtml(message) + '</div>';
    }

    function showError(message = 'could not load games') {
      grid.innerHTML = '<div class="status">' + escapeHtml(message) + '</div>';
    }

    function renderGrid() {
      if (!state.games.length) {
        grid.innerHTML = '<div class="empty">no games found</div>';
        return;
      }

      grid.innerHTML = '';

      state.games.forEach((game, index) => {
        const card = document.createElement('article');
        const active = state.activeGameId === game.id;
        const large = randomizeSize(index, game) && !active;
        card.className = 'card' + (large ? ' large' : '') + (active ? ' active' : '');
        card.dataset.gameId = game.id;

        const imageUrl = state.imageMap.get(game.id) || '';
        const favoriteClass = isFavorite(game.id) ? ' active' : '';
        const safeName = escapeHtml(game.name || 'Untitled');
        const safeCategory = escapeHtml(game.category || 'Game');

        if (active && state.activeGameUrl) {
          card.innerHTML = `
            <div class="card-player">
              <iframe
                src="${escapeHtml(state.activeGameUrl)}"
                allowfullscreen
                loading="eager"
                referrerpolicy="origin"
              ></iframe>
            </div>

            <div class="player-ui">
              <div class="player-meta">
                <h2 class="player-title">${safeName}</h2>
                <p class="player-subtitle">${safeCategory}</p>
              </div>

              <div class="player-controls">
                <button class="icon-btn favorite${favoriteClass}" data-action="favorite" title="Favorite">♥</button>
                <button class="icon-btn" data-action="reload" title="Reload">↻</button>
                <button class="icon-btn" data-action="fullscreen" title="Fullscreen">⛶</button>
                <button class="icon-btn" data-action="close" title="Close">×</button>
              </div>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="card-media">
              <img src="${escapeHtml(imageUrl)}" alt="${safeName}" loading="lazy">
            </div>
            <div class="card-overlay">
              <div>
                <div class="card-name">${safeName}</div>
                <div class="card-tag">${safeCategory}</div>
              </div>
            </div>
          `;
        }

        card.addEventListener('click', async (event) => {
          const action = event.target && event.target.dataset ? event.target.dataset.action : null;

          if (action) {
            event.stopPropagation();

            if (action === 'favorite') {
              toggleFavorite(game.id);
              return;
            }

            if (action === 'reload') {
              const iframe = card.querySelector('iframe');
              if (iframe) {
                iframe.src = iframe.src;
              }
              return;
            }

            if (action === 'fullscreen') {
              const iframe = card.querySelector('iframe');
              const target = iframe || card;
              if (target.requestFullscreen) {
                target.requestFullscreen();
              }
              return;
            }

            if (action === 'close') {
              state.activeGameId = null;
              state.activeGameUrl = '';
              clearHash();
              renderGrid();
              return;
            }
          }

          await openGameInGrid(game.id);
        });

        grid.appendChild(card);
      });
    }

    async function resolveImages(games) {
      const tasks = games.map(async (game) => {
        if (state.imageMap.has(game.id)) return;
        try {
          const url = await Lumin.getImageUrl(game.image_token);
          state.imageMap.set(game.id, url);
        } catch (err) {
          state.imageMap.set(game.id, '');
        }
      });

      await Promise.all(tasks);
    }

    async function loadPage(page = 1) {
      state.loading = true;
      showLoading();

      try {
        const result = await Lumin.getGames({
          page,
          limit: PAGE_SIZE,
          q: state.query
        });

        state.currentPage = page;
        state.totalPages = result.pages || 1;
        state.games = Array.isArray(result.games) ? result.games : [];

        await resolveImages(state.games);
        updatePagination();
        renderGrid();
      } catch (err) {
        console.error(err);
        showError('could not load games');
      } finally {
        state.loading = false;
      }
    }

    async function openGameInGrid(gameId) {
      try {
        const game = state.games.find(g => g.id === gameId);
        if (!game) return;

        const result = await Lumin.getGameUrl(gameId);
        if (!result || !result.url) {
          alert('unable to open this game');
          return;
        }

        state.activeGameId = gameId;
        state.activeGameUrl = result.url;
        setHashForGame(game);
        renderGrid();

        const activeCard = document.querySelector('.card.active');
        if (activeCard) {
          activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      } catch (err) {
        console.error(err);
        alert('unable to open this game');
      }
    }

    function updatePagination() {
      pageInfo.textContent = 'page ' + state.currentPage + ' / ' + state.totalPages;
      prevBtn.disabled = state.currentPage <= 1;
      nextBtn.disabled = state.currentPage >= state.totalPages;
      pagination.classList.toggle('hidden', state.totalPages <= 1);
    }

    const onSearch = debounce(() => {
      state.query = searchInput.value.trim();
      state.currentPage = 1;
      state.activeGameId = null;
      state.activeGameUrl = '';
      clearHash();
      loadPage(1);
    }, 300);

    searchInput.addEventListener('input', onSearch);
    searchBtn.addEventListener('click', () => {
      state.query = searchInput.value.trim();
      state.currentPage = 1;
      state.activeGameId = null;
      state.activeGameUrl = '';
      clearHash();
      loadPage(1);
    });

    settingsBtn.addEventListener('click', () => {
      alert('settings panel coming next');
    });

    prevBtn.addEventListener('click', () => {
      if (state.currentPage > 1) {
        state.activeGameId = null;
        state.activeGameUrl = '';
        clearHash();
        loadPage(state.currentPage - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (state.currentPage < state.totalPages) {
        state.activeGameId = null;
        state.activeGameUrl = '';
        clearHash();
        loadPage(state.currentPage + 1);
      }
    });

    async function init() {
      try {
        await Lumin.init({
          headless: true,
          onReady: () => console.log('Lumin connected'),
          onError: (err) => console.error('Lumin error:', err)
        });

        await loadPage(1);
      } catch (err) {
        console.error(err);
        showError('failed to initialize sdk');
      }
    }

    init();
  </script>
</body>
</html>
