<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>velora</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: rgba(18, 18, 18, 0.92);
      --panel-border: rgba(255, 255, 255, 0.08);
      --card: #171717;
      --card-hover: #202020;
      --text: #f2f2f2;
      --muted: #b5b5b5;
      --accent: #f0c040;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --radius-sm: 12px;
      --ui-width: 220px;
      --gap: 12px;
      --tile-size: 140px;
      --font-ui: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive;

      --body-glow-1: rgba(240, 192, 64, 0.08);
      --body-glow-2: rgba(255, 255, 255, 0.03);
      --body-glow-3: rgba(240, 192, 64, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at top left, var(--body-glow-1), transparent 30%),
        radial-gradient(circle at bottom right, var(--body-glow-2), transparent 25%),
        radial-gradient(circle at center, var(--body-glow-3), transparent 38%),
        var(--bg);
      transition: background 0.25s ease;
    }

    button, input, select {
      font-family: var(--font-ui);
    }

    .app {
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    .ui-box {
      position: fixed;
      top: 14px;
      left: 14px;
      width: min(var(--ui-width), calc(100vw - 28px));
      z-index: 30;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ui-top {
      padding: 14px;
    }

    .brand {
      margin: 0;
      font-size: 20px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      color: var(--text);
    }

    .ui-bottom {
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255,255,255,0.02);
    }

    .ui-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      height: 38px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #161616;
      color: var(--text);
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: 0.18s ease;
    }

    .btn:hover {
      background: #1f1f1f;
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-accent {
      background: rgba(240, 192, 64, 0.12);
      border-color: rgba(240, 192, 64, 0.28);
      color: #ffd77a;
    }

    .grid-wrap {
      width: 100%;
      min-height: 100vh;
      padding: 12px;
      padding-top: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--tile-size), 1fr));
      grid-auto-flow: dense;
      gap: var(--gap);
      width: 100%;
    }

    .card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: var(--card);
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.04);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      min-height: var(--tile-size);
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(255,255,255,0.12);
    }

    .card.large {
      grid-column: span 2;
      grid-row: span 2;
    }

    .card.active {
      grid-column: span 2;
      grid-row: span 2;
      aspect-ratio: 16 / 9;
      z-index: 2;
      border-color: rgba(240, 192, 64, 0.45);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      background: #111;
    }

    .card-media,
    .card-player {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    .card-media img,
    .card-player iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      object-fit: cover;
      background: #0f0f0f;
    }

    .card-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .card-name {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
    }

    .player-ui {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      z-index: 3;
      pointer-events: none;
    }

    .player-meta,
    .player-controls {
      pointer-events: auto;
    }

    .player-meta {
      max-width: calc(100% - 180px);
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(10, 10, 10, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }

    .player-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      margin: 0;
    }

    .player-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .icon-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(10, 10, 10, 0.74);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      transition: 0.18s ease;
    }

    .icon-btn:hover {
      background: rgba(25, 25, 25, 0.95);
      border-color: rgba(255,255,255,0.18);
    }

    .icon-btn.favorite.active {
      color: #ff95a7;
      border-color: rgba(255, 107, 129, 0.35);
    }

    .status,
    .empty {
      grid-column: 1 / -1;
      min-height: 180px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }

    .sentinel {
      width: 100%;
      height: 1px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      padding: 18px;
    }

    .modal-panel {
      width: min(420px, 100%);
      background: rgba(18, 18, 18, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-top {
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    .modal-body {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .field input[type="text"],
    .field select,
    .field input[type="range"] {
      width: 100%;
    }

    .field input[type="text"],
    .field select {
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #121212;
      color: var(--text);
      padding: 0 12px;
      outline: none;
      font-size: 14px;
    }

    .field input[type="text"]::placeholder {
      color: #7d7d7d;
    }

    .field input[type="text"]:focus,
    .field select:focus {
      border-color: rgba(240, 192, 64, 0.6);
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .range-value {
      min-width: 44px;
      text-align: right;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 2px;
    }

    @media (max-width: 900px) {
      .card.active {
        grid-column: span 2;
        grid-row: span 2;
      }
    }

    @media (max-width: 640px) {
      :root {
        --ui-width: 210px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      }

      .card.large {
        grid-column: span 1;
        grid-row: span 1;
      }

      .card.active {
        grid-column: span 2;
        grid-row: span 2;
      }

      .player-meta {
        max-width: calc(100% - 120px);
      }

      .player-title {
        font-size: 13px;
      }

      .icon-btn {
        min-width: 34px;
        height: 34px;
        padding: 0 10px;
        font-size: 12px;
      }

      .ui-box {
        width: min(210px, calc(100vw - 28px));
      }

      .modal-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="ui-box">
      <div class="ui-top">
        <h1 class="brand">velora</h1>
      </div>

      <div class="ui-bottom">
        <div class="ui-actions">
          <button id="searchBtn" class="btn btn-accent">search</button>
          <button id="settingsBtn" class="btn">settings</button>
        </div>
      </div>
    </aside>

    <main class="grid-wrap">
      <section id="grid" class="grid"></section>
      <div id="sentinel" class="sentinel"></div>
    </main>

    <div id="searchModal" class="modal hidden" aria-hidden="true">
      <div class="modal-panel">
        <div class="modal-top">
          <h2 class="modal-title">search</h2>
          <button id="closeSearchModal" class="btn" style="width: 38px; padding: 0;">×</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="searchInput">search games</label>
            <input id="searchInput" type="text" placeholder="type here">
          </div>
          <div class="modal-actions">
            <button id="runSearchBtn" class="btn btn-accent">go</button>
            <button id="clearSearchBtn" class="btn">clear</button>
          </div>
        </div>
      </div>
    </div>

    <div id="settingsModal" class="modal hidden" aria-hidden="true">
      <div class="modal-panel">
        <div class="modal-top">
          <h2 class="modal-title">settings</h2>
          <button id="closeSettingsModal" class="btn" style="width: 38px; padding: 0;">×</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="themeSelect">style</label>
            <select id="themeSelect">
              <option value="amber">amber</option>
              <option value="violet">violet</option>
              <option value="ocean">ocean</option>
              <option value="rose">rose</option>
              <option value="mono">mono</option>
            </select>
          </div>

          <div class="field">
            <label for="tileSize">tile size</label>
            <div class="range-row">
              <input id="tileSize" type="range" min="110" max="220" step="2" value="140">
              <div id="tileSizeValue" class="range-value">140</div>
            </div>
          </div>

          <div class="field">
            <label for="gapSize">gaps</label>
            <div class="range-row">
              <input id="gapSize" type="range" min="6" max="24" step="1" value="12">
              <div id="gapSizeValue" class="range-value">12</div>
            </div>
          </div>

          <div class="modal-actions">
            <button id="resetSettingsBtn" class="btn">reset</button>
            <button id="saveSettingsBtn" class="btn btn-accent">save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    const PAGE_SIZE = 24;
    const FAVORITES_KEY = 'veloraFavorites_v1';
    const SETTINGS_KEY = 'veloraSettings_v1';

    const grid = document.getElementById('grid');
    const sentinel = document.getElementById('sentinel');

    const searchBtn = document.getElementById('searchBtn');
    const settingsBtn = document.getElementById('settingsBtn');

    const searchModal = document.getElementById('searchModal');
    const closeSearchModal = document.getElementById('closeSearchModal');
    const searchInput = document.getElementById('searchInput');
    const runSearchBtn = document.getElementById('runSearchBtn');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsModal = document.getElementById('closeSettingsModal');
    const themeSelect = document.getElementById('themeSelect');
    const tileSize = document.getElementById('tileSize');
    const gapSize = document.getElementById('gapSize');
    const tileSizeValue = document.getElementById('tileSizeValue');
    const gapSizeValue = document.getElementById('gapSizeValue');
    const resetSettingsBtn = document.getElementById('resetSettingsBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');

    const state = {
      currentPage: 0,
      totalPages: 1,
      query: '',
      games: [],
      imageMap: new Map(),
      activeGameId: null,
      activeGameUrl: '',
      loading: false,
      loadedPages: new Set()
    };

    const themes = {
      amber: {
        bg: '#0a0a0a',
        panel: 'rgba(18, 18, 18, 0.92)',
        panelBorder: 'rgba(255, 255, 255, 0.08)',
        card: '#171717',
        cardHover: '#202020',
        text: '#f2f2f2',
        muted: '#b5b5b5',
        accent: '#f0c040',
        bodyGlow1: 'rgba(240, 192, 64, 0.08)',
        bodyGlow2: 'rgba(255, 255, 255, 0.03)',
        bodyGlow3: 'rgba(240, 192, 64, 0.04)'
      },
      violet: {
        bg: '#090812',
        panel: 'rgba(17, 16, 28, 0.92)',
        panelBorder: 'rgba(190, 150, 255, 0.14)',
        card: '#151320',
        cardHover: '#1d1a2b',
        text: '#f5f3ff',
        muted: '#b8b2cf',
        accent: '#b78cff',
        bodyGlow1: 'rgba(183, 140, 255, 0.10)',
        bodyGlow2: 'rgba(255, 255, 255, 0.03)',
        bodyGlow3: 'rgba(183, 140, 255, 0.04)'
      },
      ocean: {
        bg: '#071014',
        panel: 'rgba(12, 22, 26, 0.92)',
        panelBorder: 'rgba(112, 232, 255, 0.12)',
        card: '#102026',
        cardHover: '#153038',
        text: '#edf9ff',
        muted: '#aad0da',
        accent: '#69dcff',
        bodyGlow1: 'rgba(105, 220, 255, 0.10)',
        bodyGlow2: 'rgba(255, 255, 255, 0.03)',
        bodyGlow3: 'rgba(105, 220, 255, 0.04)'
      },
      rose: {
        bg: '#140b10',
        panel: 'rgba(28, 14, 20, 0.92)',
        panelBorder: 'rgba(255, 158, 191, 0.14)',
        card: '#241219',
        cardHover: '#311722',
        text: '#fff1f6',
        muted: '#e1b5c5',
        accent: '#ff8fb1',
        bodyGlow1: 'rgba(255, 143, 177, 0.10)',
        bodyGlow2: 'rgba(255, 255, 255, 0.03)',
        bodyGlow3: 'rgba(255, 143, 177, 0.04)'
      },
      mono: {
        bg: '#0b0b0b',
        panel: 'rgba(20, 20, 20, 0.94)',
        panelBorder: 'rgba(255,255,255,0.08)',
        card: '#171717',
        cardHover: '#222222',
        text: '#f2f2f2',
        muted: '#aaaaaa',
        accent: '#ffffff',
        bodyGlow1: 'rgba(255,255,255,0.05)',
        bodyGlow2: 'rgba(255,255,255,0.03)',
        bodyGlow3: 'rgba(255,255,255,0.02)'
      }
    };

    function getFavorites() {
      try {
        const raw = localStorage.getItem(FAVORITES_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function isFavorite(id) {
      return getFavorites().includes(id);
    }

    function toggleFavorite(id) {
      const favorites = getFavorites();
      const next = favorites.includes(id)
        ? favorites.filter(x => x !== id)
        : [...favorites, id];
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(next));
      renderGrid(false);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function randomizeSize(index, game) {
      const base = (game.id || index || 0).toString();
      let sum = 0;
      for (let i = 0; i < base.length; i++) sum += base.charCodeAt(i);
      return sum % 7 === 0;
    }

    function setHashForGame(game) {
      const slug = (game.name || 'game')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '');
      history.replaceState(null, '', '#' + slug + '-' + game.id);
    }

    function clearHash() {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    function showLoading(message = 'loading games...') {
      grid.innerHTML = '<div class="status">' + escapeHtml(message) + '</div>';
    }

    function showError(message = 'could not load games') {
      grid.innerHTML = '<div class="status">' + escapeHtml(message) + '</div>';
    }

    function createGameCard(game, index) {
      const card = document.createElement('article');
      const active = state.activeGameId === game.id;
      const large = randomizeSize(index, game) && !active;
      card.className = 'card' + (large ? ' large' : '') + (active ? ' active' : '');
      card.dataset.gameId = game.id;

      const imageUrl = state.imageMap.get(game.id) || '';
      const favoriteClass = isFavorite(game.id) ? ' active' : '';
      const safeName = escapeHtml(game.name || 'Untitled');
      const safeCategory = escapeHtml(game.category || 'Game');

      if (active && state.activeGameUrl) {
        card.innerHTML = `
          <div class="card-player">
            <iframe
              src="${escapeHtml(state.activeGameUrl)}"
              allowfullscreen
              loading="eager"
              referrerpolicy="origin"
            ></iframe>
          </div>

          <div class="player-ui">
            <div class="player-meta">
              <h2 class="player-title">${safeName}</h2>
            </div>

            <div class="player-controls">
              <button class="icon-btn favorite${favoriteClass}" data-action="favorite" title="Favorite">♥</button>
              <button class="icon-btn" data-action="reload" title="Reload">↻</button>
              <button class="icon-btn" data-action="fullscreen" title="Fullscreen">⛶</button>
              <button class="icon-btn" data-action="close" title="Close">×</button>
            </div>
          </div>
        `;
      } else {
        card.innerHTML = `
          <div class="card-media">
            <img src="${escapeHtml(imageUrl)}" alt="${safeName}" loading="lazy">
          </div>
          <div class="card-overlay">
            <div>
              <div class="card-name">${safeName}</div>
            </div>
          </div>
        `;
      }

      card.addEventListener('click', async (event) => {
        const action = event.target && event.target.dataset ? event.target.dataset.action : null;

        if (action) {
          event.stopPropagation();

          if (action === 'favorite') {
            toggleFavorite(game.id);
            return;
          }

          if (action === 'reload') {
            const iframe = card.querySelector('iframe');
            if (iframe) iframe.src = iframe.src;
            return;
          }

          if (action === 'fullscreen') {
            const iframe = card.querySelector('iframe');
            const target = iframe || card;
            if (target.requestFullscreen) target.requestFullscreen();
            return;
          }

          if (action === 'close') {
            state.activeGameId = null;
            state.activeGameUrl = '';
            clearHash();
            renderGrid(false);
            return;
          }
        }

        await openGameInGrid(game.id);
      });

      return card;
    }

    function renderGrid(append = false) {
      if (!append) {
        if (!state.games.length) {
          grid.innerHTML = '<div class="empty">no games found</div>';
          return;
        }
        grid.innerHTML = '';
      }

      const startIndex = append ? Math.max(0, grid.querySelectorAll('.card').length) : 0;
      const fragment = document.createDocumentFragment();

      const gamesToRender = append ? state.games.slice(startIndex) : state.games;

      gamesToRender.forEach((game, i) => {
        fragment.appendChild(createGameCard(game, startIndex + i));
      });

      grid.appendChild(fragment);
    }

    async function resolveImages(games) {
      const tasks = games.map(async (game) => {
        if (state.imageMap.has(game.id)) return;
        try {
          const url = await Lumin.getImageUrl(game.image_token);
          state.imageMap.set(game.id, url);
        } catch {
          state.imageMap.set(game.id, '');
        }
      });

      await Promise.all(tasks);
    }

    async function loadPage(page = 1, append = false) {
      if (state.loading) return;
      if (state.loadedPages.has(page)) return;

      state.loading = true;

      if (!append) {
        showLoading();
      }

      try {
        const result = await Lumin.getGames({
          page,
          limit: PAGE_SIZE,
          q: state.query
        });

        const nextGames = Array.isArray(result.games) ? result.games : [];
        state.currentPage = page;
        state.totalPages = result.pages || 1;
        state.loadedPages.add(page);

        await resolveImages(nextGames);

        if (append) {
          state.games = [...state.games, ...nextGames];
          renderGrid(true);
        } else {
          state.games = nextGames;
          renderGrid(false);
        }

        updateEndState();
      } catch (err) {
        console.error(err);
        showError('could not load games');
      } finally {
        state.loading = false;
      }
    }

    async function openGameInGrid(gameId) {
      try {
        const game = state.games.find(g => g.id === gameId);
        if (!game) return;

        const result = await Lumin.getGameUrl(gameId);
        if (!result || !result.url) {
          alert('unable to open this game');
          return;
        }

        state.activeGameId = gameId;
        state.activeGameUrl = result.url;
        setHashForGame(game);
        renderGrid(false);

        const activeCard = document.querySelector('.card.active');
        if (activeCard) {
          activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      } catch (err) {
        console.error(err);
        alert('unable to open this game');
      }
    }

    function updateEndState() {
      if (state.currentPage >= state.totalPages) {
        sentinel.style.display = 'none';
      } else {
        sentinel.style.display = 'block';
      }
    }

    function resetForNewQuery() {
      state.currentPage = 0;
      state.totalPages = 1;
      state.games = [];
      state.imageMap = new Map();
      state.loadedPages = new Set();
      state.activeGameId = null;
      state.activeGameUrl = '';
      clearHash();
      sentinel.style.display = 'block';
    }

    function openModal(modal) {
      modal.classList.remove('hidden');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeModal(modal) {
      modal.classList.add('hidden');
      modal.setAttribute('aria-hidden', 'true');
    }

    function applyTheme(name) {
      const theme = themes[name] || themes.amber;
      const root = document.documentElement.style;

      root.setProperty('--bg', theme.bg);
      root.setProperty('--panel', theme.panel);
      root.setProperty('--panel-border', theme.panelBorder);
      root.setProperty('--card', theme.card);
      root.setProperty('--card-hover', theme.cardHover);
      root.setProperty('--text', theme.text);
      root.setProperty('--muted', theme.muted);
      root.setProperty('--accent', theme.accent);
      root.setProperty('--body-glow-1', theme.bodyGlow1);
      root.setProperty('--body-glow-2', theme.bodyGlow2);
      root.setProperty('--body-glow-3', theme.bodyGlow3);
    }

    function readSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveSettings() {
      const settings = {
        theme: themeSelect.value,
        tileSize: Number(tileSize.value),
        gap: Number(gapSize.value)
      };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      applySettingsToUI(settings);
    }

    function applySettingsToUI(settings) {
      const theme = settings.theme || 'amber';
      const size = Number(settings.tileSize || 140);
      const gap = Number(settings.gap || 12);

      themeSelect.value = theme;
      tileSize.value = size;
      gapSize.value = gap;
      tileSizeValue.textContent = String(size);
      gapSizeValue.textContent = String(gap);

      document.documentElement.style.setProperty('--tile-size', size + 'px');
      document.documentElement.style.setProperty('--gap', gap + 'px');
      applyTheme(theme);
    }

    function loadSettings() {
      const settings = readSettings();
      applySettingsToUI({
        theme: settings.theme || 'amber',
        tileSize: settings.tileSize || 140,
        gap: settings.gap || 12
      });
    }

    function submitSearch() {
      state.query = searchInput.value.trim();
      resetForNewQuery();
      loadPage(1, false);
      closeModal(searchModal);
    }

    searchBtn.addEventListener('click', () => {
      openModal(searchModal);
      setTimeout(() => {
        searchInput.value = state.query;
        searchInput.focus();
        searchInput.select();
      }, 50);
    });

    settingsBtn.addEventListener('click', () => {
      openModal(settingsModal);
    });

    closeSearchModal.addEventListener('click', () => closeModal(searchModal));
    closeSettingsModal.addEventListener('click', () => closeModal(settingsModal));

    runSearchBtn.addEventListener('click', submitSearch);

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      state.query = '';
      resetForNewQuery();
      loadPage(1, false);
      closeModal(searchModal);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitSearch();
      }
      if (e.key === 'Escape') closeModal(searchModal);
    });

    themeSelect.addEventListener('change', () => {
      applySettingsToUI({
        theme: themeSelect.value,
        tileSize: Number(tileSize.value),
        gap: Number(gapSize.value)
      });
    });

    tileSize.addEventListener('input', () => {
      tileSizeValue.textContent = tileSize.value;
      document.documentElement.style.setProperty('--tile-size', tileSize.value + 'px');
    });

    gapSize.addEventListener('input', () => {
      gapSizeValue.textContent = gapSize.value;
      document.documentElement.style.setProperty('--gap', gapSize.value + 'px');
    });

    saveSettingsBtn.addEventListener('click', () => {
      saveSettings();
      closeModal(settingsModal);
    });

    resetSettingsBtn.addEventListener('click', () => {
      const defaults = {
        theme: 'amber',
        tileSize: 140,
        gap: 12
      };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(defaults));
      applySettingsToUI(defaults);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal(searchModal);
        closeModal(settingsModal);
      }
    });

    searchModal.addEventListener('click', (e) => {
      if (e.target === searchModal) closeModal(searchModal);
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) closeModal(settingsModal);
    });

    const observer = new IntersectionObserver(async (entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting && !state.loading && state.currentPage < state.totalPages) {
          await loadPage(state.currentPage + 1, true);
        }
      }
    }, { root: null, rootMargin: '600px 0px', threshold: 0 });

    observer.observe(sentinel);

    async function init() {
      try {
        loadSettings();

        await Lumin.init({
          headless: true,
          onReady: () => console.log('Lumin connected'),
          onError: (err) => console.error('Lumin error:', err)
        });

        await loadPage(1, false);
      } catch (err) {
        console.error(err);
        showError('failed to initialize sdk');
      }
    }

    init();
  </script>
</body>
</html>
