<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>html editor</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui;
}

body{
  height:100vh;
  overflow:hidden;
  background:#0b0f14;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:40px;
  background:#111826;
  border-bottom:1px solid #1f2a3a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  z-index:10;
  color:white;
}

.buttons{
  display:flex;
  gap:8px;
}

button{
  background:#1f6feb;
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.container{
  display:flex;
  height:100vh;
  padding-top:40px;
}

textarea{
  width:50%;
  height:100%;
  background:#0d1117;
  color:#c9d1d9;
  border:none;
  outline:none;
  resize:none;
  padding:12px;
  font-size:14px;
}

iframe{
  width:50%;
  height:100%;
  border:none;
  background:white;
}

.preview-fullscreen iframe{
  position:fixed;
  top:40px;
  left:0;
  width:100vw;
  height:calc(100vh - 40px);
  z-index:999;
}

.preview-fullscreen textarea{
  display:none;
}
</style>
</head>

<body>

<div class="topbar">
  <div>html editor</div>

  <div class="buttons">
    <button onclick="run()">run</button>
    <button onclick="togglePreviewFullscreen()">fullscreen</button>
  </div>
</div>

<div class="container" id="app">
<textarea id="code"><!doctype html>
<html>
<body style="background:black;color:white;display:flex;justify-content:center;align-items:center;height:100vh;">
<h1>hello world</h1>
</body>
</html></textarea>

<iframe id="preview"></iframe>
</div>

<script>
const code = document.getElementById("code");
const preview = document.getElementById("preview");
const app = document.getElementById("app");

function run(){
  preview.srcdoc = code.value;
}

function togglePreviewFullscreen(){
  app.classList.toggle("preview-fullscreen");
}

run();
</script>

</body>
</html>
