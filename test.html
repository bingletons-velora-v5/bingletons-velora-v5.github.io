<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>html editor</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
    body{height:100vh;display:flex;background:#0b0f14;color:#fff;overflow:hidden}

    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 10px;
      background:#111826;
      border-bottom:1px solid #1f2a3a;
      z-index:10;
    }

    button{
      background:#1f6feb;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
    }

    button:active{transform:scale(0.97)}

    .container{
      display:flex;
      width:100%;
      height:100%;
      padding-top:40px;
    }

    textarea{
      width:50%;
      height:100%;
      background:#0d1117;
      color:#c9d1d9;
      border:none;
      outline:none;
      padding:10px;
      font-size:14px;
      resize:none;
    }

    iframe{
      width:50%;
      height:100%;
      border:none;
      background:white;
    }

    .fullscreen textarea{width:100%}
    .fullscreen iframe{display:none}
  </style>
</head>
<body>

  <div class="topbar">
    <div>html editor</div>
    <div>
      <button onclick="run()">run</button>
      <button onclick="toggleFullscreen()">fullscreen</button>
    </div>
  </div>

  <div id="app" class="container">
    <textarea id="code"><!doctype html>
<html>
<body>
  <h1>hello world</h1>
</body>
</html></textarea>
    <iframe id="preview"></iframe>
  </div>

<script>
function run(){
  const code = document.getElementById('code').value;
  const iframe = document.getElementById('preview');
  iframe.srcdoc = code;
}

function toggleFullscreen(){
  document.getElementById('app').classList.toggle('fullscreen');
}

run();
</script>

</body>
</html>
